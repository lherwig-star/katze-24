name: Debug JSON-LD (temporaer)

# Nur zum einmaligen Nachschauen, ob das Zooplus-Rabatt-Badge im rohen
# HTML steckt oder per JS reingerendert wird (siehe Chat-Verlauf). Wird
# danach wieder entfernt - kein Teil des eigentlichen Crawlers.

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - run: pip install -r requirements.txt

      - name: Rohe JSON-LD-Bloecke ausgeben
        run: python scripts/debug_jsonld.py
